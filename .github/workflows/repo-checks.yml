name: Repo Checks [Twork]

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secrets-not-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # these files hold real credentials/session data and must never be tracked
      - name: Fail if real secrets/session files are tracked
        run: |
          bad=0
          for f in config.yaml session.session; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked in git -- it should only exist locally (see .gitignore)."
              bad=1
            fi
          done
          if git ls-files | grep -E '\.(db|sqlite)$' >/dev/null; then
            echo "::error::A database file is tracked in git."
            bad=1
          fi
          exit $bad

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml .

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: ".markdownlint.yaml"
          globs: "**/*.md"

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked files over 2MB
        run: |
          big=$(git ls-files | xargs -I{} du -k {} 2>/dev/null | awk '$1 > 2048 {print}')
          if [ -n "$big" ]; then
            echo "::error::Files over 2MB are tracked:"
            echo "$big"
            exit 1
          fi
          