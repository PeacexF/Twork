name: Go CI [Twork]

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CGO_ENABLED: 1
  GO_BUILD_TAGS: sqlite_fts5

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # mattn/go-sqlite3 needs CGO + a C
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      # internal/web embeds internal/web/dist via go:embed, so go vet/build/test
      # below all need a real build here, not just the committed placeholder.
      - name: Build web dashboard
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet -tags "$GO_BUILD_TAGS" ./...

      - name: Build
        run: go build -tags "$GO_BUILD_TAGS" ./...

      - name: Test
        run: |
          go test -tags "$GO_BUILD_TAGS" -race \
            -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage report
        if: always() && hashFiles('coverage.out') != ''
        run: |
          go tool cover -func=coverage.out -o coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage"
            echo
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
            echo
            echo "<details><summary>Per-function breakdown</summary>"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
            coverage.html
          retention-days: 14
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: goinstall
          args: --build-tags=sqlite_fts5 --timeout=5m

  # OOM Docker
  build-linux-arm64:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile for linux/arm64
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: go build -tags sqlite_fts5 -o twork-linux-arm64 ./cmd/twork

      - uses: actions/upload-artifact@v4
        with:
          name: twork-linux-arm64
          path: twork-linux-arm64