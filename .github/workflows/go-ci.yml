name: Go CI [Twork]

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CGO_ENABLED: 1
  GO_BUILD_TAGS: sqlite_fts5

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # mattn/go-sqlite3 needs CGO + a C
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet -tags "$GO_BUILD_TAGS" ./...

      - name: Build
        run: go build -tags "$GO_BUILD_TAGS" ./...

      - name: Test
        run: go test -tags "$GO_BUILD_TAGS" -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: goinstall
          args: --build-tags=sqlite_fts5 --timeout=5m
          